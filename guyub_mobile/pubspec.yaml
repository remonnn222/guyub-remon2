name: guyub_mobile
description: "Guyub Family Tree Platform - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  google_fonts: ^7.0.0
  smooth_page_indicator: ^1.1.0

  # State Management (Riverpod)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^7.0.0

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^17.0.1

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.3.2

  # Tree Visualization
  graphview: ^1.2.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Firebase
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  firebase_auth: ^5.1.1
  firebase_crashlytics: ^4.0.3
  firebase_analytics: ^11.2.0

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # Utilities
  uuid: ^4.2.1
  image_picker: ^1.0.4
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  logger: ^2.0.2

  # Security & Biometric
  local_auth: ^2.3.0

  # Deep Linking & Sharing
  app_links: ^6.3.2
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.0+1
  injectable_generator: ^2.4.1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  # Note: Using google_fonts package for Inter font
  # Remove custom fonts section to avoid asset errors
