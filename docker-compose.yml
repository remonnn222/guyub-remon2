version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: guyub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-guyub}
      MYSQL_USER: ${DB_USERNAME:-guyub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
   # ports:
     # - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Go API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guyub-backend
    restart: unless-stopped
    environment:
      APP_NAME: Guyub-Platform
      APP_ENV: development
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-guyub}
      DB_USERNAME: ${DB_USERNAME:-guyub}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRY: 3600
      STORAGE_PATH: /app/storage/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React (development)
  frontend:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: guyub-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}/api/v1
      VITE_ASSETS_URL: http://localhost:${API_PORT:-8080}/assets
      VITE_APP_NAME: Guyub Platform
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_storage:

networks:
  default:
    name: guyub-network
